services:
  minio:
    # RELEASE-теги на Docker Hub часто исчезают/переименовываются — для локального compose используем стабильный latest
    profiles: ["local-s3"]
    image: minio/minio:latest
    container_name: user-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - miniodata:/data

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    container_name: user-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then echo "minio not reachable"; exit 1; fi
          sleep 1
        done
        mc mb "local/$$S3_BUCKET" --ignore-existing
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-fotos}"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-user_service}"
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-user_service}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: user-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-user_service}?sslmode=disable",
        "up"
      ]
    restart: "no"

  # Отдельная Postgres + migrate только для go test (integration/smoke).
  # Не стартует при обычном `docker compose up` — нужен профиль: `docker compose --profile test up -d`
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: user-postgres-test
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_TEST_DB:-user_service_test}"
    ports:
      - "${POSTGRES_TEST_PORT_HOST:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_TEST_DB:-user_service_test}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  migrate-test:
    profiles: ["test"]
    image: migrate/migrate:v4.18.3
    container_name: user-migrate-test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-test:5432/${POSTGRES_TEST_DB:-user_service_test}?sslmode=disable",
        "up"
      ]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_PORT: "${GRPC_PORT:-50051}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-user_service}?sslmode=disable"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-fotos}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
    ports:
      - "${GRPC_PORT_HOST:-50051}:${GRPC_PORT:-50051}"
    restart: unless-stopped

volumes:
  pgdata:
  pgtestdata:
  miniodata:


