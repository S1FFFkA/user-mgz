services:
  minio:
    # RELEASE-теги на Docker Hub часто исчезают/переименовываются — для локального compose используем стабильный latest
    profiles: ["local-s3"]
    image: minio/minio:latest
    container_name: user-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - miniodata:/data

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    container_name: user-minio-init
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then echo "minio not reachable"; exit 1; fi
          sleep 1
        done
        mc mb "local/$$S3_BUCKET" --ignore-existing
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-fotos}"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-user_service}"
    ports:
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-user_service}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: user-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-user_service}?sslmode=disable",
        "up"
      ]
    restart: "no"

  # Отдельная Postgres + migrate только для go test (integration/smoke).
  # Не стартует при обычном `docker compose up` — нужен профиль: `docker compose --profile test up -d`
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: user-postgres-test
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_TEST_DB:-user_service_test}"
    ports:
      - "${POSTGRES_TEST_PORT_HOST:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_TEST_DB:-user_service_test}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgtestdata:/var/lib/postgresql/data

  migrate-test:
    profiles: ["test"]
    image: migrate/migrate:v4.18.3
    container_name: user-migrate-test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-test:5432/${POSTGRES_TEST_DB:-user_service_test}?sslmode=disable",
        "up"
      ]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_PORT: "${GRPC_PORT:-50051}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-user_service}?sslmode=disable"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-fotos}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
    ports:
      - "${GRPC_PORT_HOST:-50051}:${GRPC_PORT:-50051}"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: user-kafka
    ports:
      - "${KAFKA_PORT_HOST:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    restart: unless-stopped

  push-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-push-consumer
    command: ["/app/push-consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    volumes:
      # Локальный secrets/firebase-adminsdk.json (не в git): см. secrets/README.md и env.example
      - ./secrets:/run/secrets:ro
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-user_service}?sslmode=disable"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      KAFKA_TOPIC_CHAT_MESSAGES: "${KAFKA_TOPIC_CHAT_MESSAGES:-chat.messages}"
      KAFKA_CONSUMER_GROUP: "${KAFKA_CONSUMER_GROUP:-user-mgz-push-consumer}"
      PUSH_PROVIDER: "${PUSH_PROVIDER:-noop}"
      # FCM через смонтированный каталог secrets/ (переопределяет возможные значения из .env с относительным путём хоста).
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-adminsdk.json"
      FIREBASE_CREDENTIALS_PATH: "/run/secrets/firebase-adminsdk.json"
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON:-}"
      APNS_KEY_PATH: "${APNS_KEY_PATH:-}"
      APNS_KEY_PEM: "${APNS_KEY_PEM:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_TOPIC: "${APNS_TOPIC:-}"
      APNS_SANDBOX: "${APNS_SANDBOX:-}"
    restart: unless-stopped

volumes:
  pgdata:
  pgtestdata:
  miniodata:


